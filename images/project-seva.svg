<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="foodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#bgGrad)"/>
  
  <!-- Decorative background elements -->
  <circle cx="500" cy="80" r="140" fill="#F59E0B" opacity="0.15"/>
  <circle cx="100" cy="300" r="100" fill="#D97706" opacity="0.12"/>
  
  <!-- Nutrition Bowl & Steam Illustration -->
  <g transform="translate(180, 70)">
    <!-- Steam Curves -->
    <path d="M100 45 Q115 20 100 0" stroke="#EA580C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M125 50 Q140 25 125 5" stroke="#EA580C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M150 45 Q165 20 150 0" stroke="#EA580C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Bowl Base -->
    <path d="M30 110 C30 200, 210 200, 210 110 Z" fill="url(#foodGrad)"/>
    <ellipse cx="120" cy="110" rx="90" ry="24" fill="#FED7AA"/>
    <!-- Food Heap -->
    <ellipse cx="120" cy="105" rx="75" ry="18" fill="#FBBF24"/>
    <circle cx="100" cy="100" r="10" fill="#16A34A"/>
    <circle cx="130" cy="98" r="8" fill="#DC2626"/>
    <circle cx="145" cy="104" r="9" fill="#16A34A"/>

    <!-- Bowl Stand -->
    <rect x="90" y="195" width="60" height="15" rx="7.5" fill="#9A3412"/>
  </g>

  <!-- Title Banner -->
  <rect x="40" y="295" width="220" height="42" rx="21" fill="#0F172A" opacity="0.9"/>
  <text x="150" y="322" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Project Seva</text>
  <rect x="270" y="295" width="200" height="42" rx="21" fill="#EA580C"/>
  <text x="370" y="322" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">#AnnapurnaDrive</text>
</svg>
