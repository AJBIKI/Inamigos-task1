<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="udaanBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#udaanBg)"/>
  <circle cx="490" cy="80" r="130" fill="#C084FC" opacity="0.16"/>
  <circle cx="110" cy="300" r="100" fill="#9333EA" opacity="0.1"/>

  <!-- Soaring Wings & Self-Reliance Motif -->
  <g transform="translate(180, 65)">
    <!-- Sun of Independence -->
    <circle cx="120" cy="80" r="40" fill="#F59E0B" opacity="0.2"/>
    <circle cx="120" cy="80" r="28" fill="#FBBF24"/>

    <!-- Soaring Bird / Winged Silhouette -->
    <!-- Left Wing -->
    <path d="M120 100 C70 60, 20 70, 0 110 C30 115, 60 115, 80 135 C100 130, 115 115, 120 100 Z" fill="url(#wingGrad)"/>
    <!-- Right Wing -->
    <path d="M120 100 C170 60, 220 70, 240 110 C210 115, 180 115, 160 135 C140 130, 125 115, 120 100 Z" fill="url(#wingGrad)"/>
    
    <!-- Central Rising Figure -->
    <circle cx="120" cy="115" r="10" fill="#6B21A8"/>
    <path d="M110 132 C110 126, 130 126, 130 132 L134 165 C134 170, 106 170, 106 165 Z" fill="#6B21A8"/>

    <!-- Needle / Spool of Handicraft (Micro-Enterprise Symbol) -->
    <path d="M60 170 L180 170" stroke="#7E22CE" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="60" cy="170" r="5" fill="#7E22CE"/>
    <circle cx="180" cy="170" r="5" fill="#7E22CE"/>
  </g>

  <!-- Title & Hashtag -->
  <rect x="40" y="295" width="230" height="42" rx="21" fill="#0F172A" opacity="0.9"/>
  <text x="155" y="322" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Project Udaan</text>
  <rect x="280" y="295" width="190" height="42" rx="21" fill="#7E22CE"/>
  <text x="375" y="322" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">#PeriodDignity</text>
</svg>
