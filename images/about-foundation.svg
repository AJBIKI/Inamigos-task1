<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="abtBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="abtCard" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#abtBg)"/>
  
  <!-- Central Badge / Card -->
  <g transform="translate(60, 40)">
    <rect width="480" height="370" rx="20" fill="url(#abtCard)" filter="drop-shadow(0 15px 25px rgba(15,23,42,0.15))"/>
    
    <!-- Decorative Ring -->
    <circle cx="240" cy="140" r="85" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
    <circle cx="240" cy="140" r="70" fill="#16A34A" opacity="0.15"/>

    <!-- Central Unity Emblem -->
    <circle cx="240" cy="140" r="50" fill="#16A34A"/>
    <!-- Heart / Hands Silhouette -->
    <path d="M240 120 C247 110, 263 115, 260 130 C258 142, 243 152, 240 157 C237 152, 222 142, 220 130 C217 115, 233 110, 240 120 Z" fill="#FFFFFF"/>
    <circle cx="240" cy="126" r="4" fill="#EA580C"/>

    <!-- 4 Value Nodes Connected around Circle -->
    <!-- Node 1: Compassion -->
    <circle cx="240" cy="45" r="22" fill="#F8FAFC"/>
    <circle cx="240" cy="45" r="18" fill="#FEE2E2"/>
    <text x="240" y="50" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#DC2626" text-anchor="middle">❤️</text>
    
    <!-- Node 2: Transparency -->
    <circle cx="345" cy="140" r="22" fill="#F8FAFC"/>
    <circle cx="345" cy="140" r="18" fill="#EFF6FF"/>
    <text x="345" y="145" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#2563EB" text-anchor="middle">🔍</text>
    
    <!-- Node 3: Accountability -->
    <circle cx="240" cy="235" r="22" fill="#F8FAFC"/>
    <circle cx="240" cy="235" r="18" fill="#FEF3C7"/>
    <text x="240" y="240" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#D97706" text-anchor="middle">⚖️</text>

    <!-- Node 4: Service -->
    <circle cx="135" cy="140" r="22" fill="#F8FAFC"/>
    <circle cx="135" cy="140" r="18" fill="#DCFCE7"/>
    <text x="135" y="145" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#16A34A" text-anchor="middle">🤝</text>

    <!-- Narrative Banner in Card -->
    <text x="240" y="295" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">InAmigos Foundation</text>
    <text x="240" y="320" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#94A3B8" text-anchor="middle">Established Sept 23, 2020 • Bilaspur, Chhattisgarh</text>
    <text x="240" y="342" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#4ADE80" text-anchor="middle">Section 8 Registered • MCA CSR-1 • 80G Certified</text>
  </g>
</svg>
