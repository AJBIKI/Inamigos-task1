<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="vikasBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#vikasBg)"/>
  <circle cx="500" cy="70" r="130" fill="#94A3B8" opacity="0.2"/>
  <circle cx="90" cy="300" r="100" fill="#64748B" opacity="0.12"/>

  <!-- Laptop & Rocket / Upward Career Chart -->
  <g transform="translate(175, 60)">
    <!-- Upward Trend Chart in background -->
    <polyline points="20,130 80,100 140,110 200,40" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="130" r="5" fill="#16A34A"/>
    <circle cx="80" cy="100" r="5" fill="#16A34A"/>
    <circle cx="140" cy="110" r="5" fill="#16A34A"/>
    <circle cx="200" cy="40" r="7" fill="#EA580C"/>

    <!-- Laptop Screen -->
    <rect x="35" y="80" width="170" height="105" rx="8" fill="url(#laptopGrad)"/>
    <rect x="43" y="88" width="154" height="89" rx="4" fill="#0284C7"/>
    
    <!-- Code / Career Interface on screen -->
    <rect x="52" y="98" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/>
    <rect x="52" y="110" width="80" height="5" rx="2.5" fill="#BAE6FD"/>
    <rect x="52" y="120" width="65" height="5" rx="2.5" fill="#BAE6FD"/>
    <rect x="52" y="130" width="75" height="5" rx="2.5" fill="#BAE6FD"/>
    <rect x="52" y="145" width="40" height="16" rx="4" fill="#16A34A"/>
    
    <!-- Laptop Base -->
    <path d="M15 185 L225 185 L215 198 L25 198 Z" fill="#94A3B8"/>
    <rect x="100" y="185" width="40" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Certificate Seal Badge -->
    <circle cx="195" cy="80" r="22" fill="#F59E0B"/>
    <polygon points="195,68 198,76 206,77 200,83 202,91 195,87 188,91 190,83 184,77 192,76" fill="#FFFFFF"/>
  </g>

  <!-- Title & Hashtag -->
  <rect x="40" y="295" width="220" height="42" rx="21" fill="#0F172A" opacity="0.9"/>
  <text x="150" y="322" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Project Vikas</text>
  <rect x="270" y="295" width="200" height="42" rx="21" fill="#0284C7"/>
  <text x="370" y="322" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">#InAmigosInterns</text>
</svg>
