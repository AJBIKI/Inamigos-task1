<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="prakritiBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#prakritiBg)"/>
  <circle cx="480" cy="80" r="140" fill="#4ADE80" opacity="0.18"/>
  <circle cx="100" cy="300" r="110" fill="#16A34A" opacity="0.12"/>

  <!-- Growing Tree & Green Earth & Water Drops -->
  <g transform="translate(180, 50)">
    <!-- Soil Mound -->
    <path d="M40 210 Q120 180 200 210 Z" fill="#78350F" opacity="0.6"/>
    
    <!-- Tree Trunk -->
    <path d="M110 200 C110 140, 115 120, 120 90 C125 120, 130 140, 130 200 Z" fill="#92400E"/>
    
    <!-- Tree Foliage Canopy -->
    <circle cx="120" cy="80" r="45" fill="url(#treeGrad)"/>
    <circle cx="85" cy="100" r="35" fill="url(#treeGrad)"/>
    <circle cx="155" cy="100" r="35" fill="url(#treeGrad)"/>
    <circle cx="100" cy="60" r="30" fill="#4ADE80"/>
    <circle cx="140" cy="60" r="30" fill="#4ADE80"/>

    <!-- Water Drop -->
    <path d="M190 70 C190 60, 200 50, 200 40 C200 50, 210 60, 210 70 C210 75, 205 80, 200 80 C195 80, 190 75, 190 70 Z" fill="#0284C7"/>

    <!-- Hands Holding Earth/Plant Base -->
    <path d="M50 190 C65 170, 95 185, 105 195" stroke="#16A34A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M190 190 C175 170, 145 185, 135 195" stroke="#16A34A" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Title & Hashtag -->
  <rect x="40" y="295" width="240" height="42" rx="21" fill="#0F172A" opacity="0.9"/>
  <text x="160" y="322" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Project Prakriti</text>
  <rect x="290" y="295" width="220" height="42" rx="21" fill="#16A34A"/>
  <text x="400" y="322" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">#InAmigosParyavaran</text>
</svg>
