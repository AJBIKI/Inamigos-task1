<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#eduGrad)"/>
  <circle cx="480" cy="90" r="130" fill="#60A5FA" opacity="0.18"/>
  <circle cx="90" cy="300" r="110" fill="#3B82F6" opacity="0.12"/>

  <!-- Open Book & Digital Glow -->
  <g transform="translate(170, 75)">
    <!-- Digital Device / Screen in background -->
    <rect x="50" y="10" width="160" height="110" rx="10" fill="#0F172A"/>
    <rect x="58" y="18" width="144" height="94" rx="6" fill="#1E293B"/>
    <circle cx="130" cy="65" r="22" fill="#16A34A" opacity="0.2"/>
    <path d="M122 55 L142 65 L122 75 Z" fill="#22C55E"/>

    <!-- Open Book -->
    <path d="M40 185 C80 160, 130 165, 130 180 C130 165, 180 160, 220 185 L220 135 C180 110, 130 115, 130 130 C130 115, 80 110, 40 135 Z" fill="url(#bookGrad)"/>
    <path d="M45 180 C82 158, 128 163, 128 175 L128 128 C82 113, 45 133, 45 180 Z" fill="#F8FAFC"/>
    <path d="M215 180 C178 158, 132 163, 132 175 L132 128 C178 113, 215 133, 215 180 Z" fill="#FFFFFF"/>
    
    <!-- Lines in book -->
    <line x1="60" y1="140" x2="110" y2="140" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="152" x2="110" y2="152" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="150" y1="140" x2="200" y2="140" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="150" y1="152" x2="200" y2="152" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sprouting Knowledge / Star -->
    <polygon points="130,70 133,78 141,80 135,86 137,94 130,90 123,94 125,86 119,80 127,78" fill="#F59E0B"/>
  </g>

  <!-- Title & Hashtag -->
  <rect x="40" y="295" width="260" height="42" rx="21" fill="#0F172A" opacity="0.9"/>
  <text x="170" y="322" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Project Bachpanshala</text>
  <rect x="310" y="295" width="190" height="42" rx="21" fill="#2563EB"/>
  <text x="405" y="322" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">#ProjectShiksha</text>
</svg>
