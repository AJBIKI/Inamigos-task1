<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Decorative Background Glow -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon: Stylized Caring Hands & Sprouting Leaf -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
    <!-- Heart / Leaf shape -->
    <path d="M32 18 C38 10, 52 14, 50 28 C48 38, 35 48, 32 52 C29 48, 16 38, 14 28 C12 14, 26 10, 32 18 Z" fill="url(#primaryGrad)"/>
    <!-- Inner Sprout / Unity Silhouette -->
    <path d="M32 23 C34 29, 39 33, 42 35 C38 37, 34 36, 32 43 C30 36, 26 37, 22 35 C25 33, 30 29, 32 23 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="32" cy="22" r="3.5" fill="url(#accentGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 26)">
    <!-- Brand Title -->
    <text x="0" y="16" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#0F172A" letter-spacing="-0.5">
      In<tspan fill="#16A34A">Amigos</tspan>
    </text>
    <!-- Subtitle / Legal Badge -->
    <text x="1" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="1.5">
      FOUNDATION <tspan fill="#EA580C">•</tspan> SECTION 8 NON-PROFIT
    </text>
  </g>
</svg>
